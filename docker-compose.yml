services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scrumi
      POSTGRES_PASSWORD: scrumi
      POSTGRES_DB: scrumi
    ports:
      - "5432:5432"
    volumes:
      - scrumi_pgdata:/var/lib/postgresql/data

volumes:
  scrumi_pgdata:
